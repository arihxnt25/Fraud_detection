services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  api:
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports: ["8000:8000"]
    depends_on: [mongo]

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]

volumes:
  mongo-data:
